# fly.toml app configuration file generated for vision-based-drowsiness-detection-using-ear-mediapipe-face-mesh on 2026-03-12T05:39:18Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vision-based-drowsiness-detection-using-ear-mediapipe-face-mesh'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: a stopped machine takes several seconds to wake,
  # and the camera would show NO SERVER meanwhile. Set to 0 to save money
  # when you're not testing.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = '60s'   # MediaPipe takes a while to load
    interval = '30s'
    method = 'GET'
    path = '/status'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
